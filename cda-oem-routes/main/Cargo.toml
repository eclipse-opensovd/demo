[package]
name = "main"
version = "0.1.0"
description = "CDA OEM Routes Demo"
edition.workspace = true
publish = false
homepage.workspace = true
license.workspace = true

[[bin]]
name = "cda-oem-routes"
path = "src/main.rs"

[dependencies]
opensovd-cda = { workspace = true }
cda-core = { workspace = true }
cda-sovd = { workspace = true }
cda-tracing = { workspace = true }
cda-database = { workspace = true }
cda-plugin-security = { workspace = true }
cda-interfaces = { workspace = true }
cda-health = { workspace = true }
plugin-oem-routes = { workspace = true }

clap = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
