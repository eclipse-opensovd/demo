[workspace.package]
edition = "2024"
license = "Apache-2.0"
homepage = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter"
publish = false

[workspace]
resolver = "3"
members = ["main", "plugin-oem-routes"]

[workspace.dependencies]
main = { path = "main" }
plugin-oem-routes = { path = "plugin-oem-routes" }

cda-database = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "fbf2fb83d04b39d23eb9364057a550b0f10480bb" }
cda-core = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "fbf2fb83d04b39d23eb9364057a550b0f10480bb" }
cda-interfaces = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "fbf2fb83d04b39d23eb9364057a550b0f10480bb" }
cda-plugin-security = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "fbf2fb83d04b39d23eb9364057a550b0f10480bb" }
cda-sovd = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "fbf2fb83d04b39d23eb9364057a550b0f10480bb" }
cda-tracing = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "fbf2fb83d04b39d23eb9364057a550b0f10480bb" }
opensovd-cda = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "fbf2fb83d04b39d23eb9364057a550b0f10480bb" }
sovd-interfaces = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "fbf2fb83d04b39d23eb9364057a550b0f10480bb" }
cda-health = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "fbf2fb83d04b39d23eb9364057a550b0f10480bb" }
cda-comm-uds = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "fbf2fb83d04b39d23eb9364057a550b0f10480bb" }
cda-comm-doip = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "fbf2fb83d04b39d23eb9364057a550b0f10480bb" }
cda-comm-can = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "fbf2fb83d04b39d23eb9364057a550b0f10480bb" }

async-trait = "0.1"
chrono = "0.4"
clap = "4.5"
futures = "0.3"
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.48.0", default-features = false }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", default-features = false }
hex = "0.4"
flatbuffers = "25.9.23"

axum = { version = "0.8", default-features = false }
schemars = "1.1.0"
aide = "0.16.0-alpha.1"
http = "1.3.1"

[patch.crates-io]
aide = { git = "https://github.com/alexmohr/aide.git", rev = "56355cb" }
doip-codec = { git = "https://github.com/theswiftfox/doip-codec.git", rev = "0dba319" }
doip-definitions = { git = "https://github.com/theswiftfox/doip-definitions.git", rev = "bdeab8c" }
flatbuffers = { git = "https://github.com/alexmohr/flatbuffers.git", rev = "0ba3307d" }
