server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    socket_path = "/run/spire/server/private/api.sock"
    trust_domain = "demo.example.org"
    data_dir = "/var/lib/spire/server/.data"
    log_level = "INFO"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/var/lib/spire/server/.data/datastore.sqlite3"
        }
    }
    NodeAttestor "x509pop" {
        plugin_data {
            ca_bundle_path = "/etc/spire/server/trusted-certs.pem"
            agent_path_template = "/{{ .PluginName }}/{{ .Subject.CommonName }}"
        }
    }
    KeyManager "memory" {
        plugin_data = {}
    }
    UpstreamAuthority "disk" {
        plugin_data {
            key_file_path = "/etc/spire/server/ca-key.pem"
            cert_file_path = "/etc/spire/server/ca-cert.pem"
        }
    }
}
