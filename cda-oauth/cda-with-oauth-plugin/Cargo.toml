[workspace.package]
edition = "2024"
license = "Apache-2.0"
homepage = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter"
publish = false

[workspace]
resolver = "3"
members = ["main", "plugin-google-oauth"]
default-members = ["main", "plugin-google-oauth"]

[workspace.dependencies]
main = { path = "main" }
plugin-google-oauth = { path = "plugin-google-oauth" }

# opensovd cda dependencies
cda-database = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "80057cba45842e1298eec8794de28dc228e544b7" }
cda-core = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "80057cba45842e1298eec8794de28dc228e544b7" }
cda-interfaces = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "80057cba45842e1298eec8794de28dc228e544b7" }
cda-plugin-security = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "80057cba45842e1298eec8794de28dc228e544b7" }
cda-sovd = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "80057cba45842e1298eec8794de28dc228e544b7" }
cda-tracing = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "80057cba45842e1298eec8794de28dc228e544b7" }
opensovd-cda = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "80057cba45842e1298eec8794de28dc228e544b7" }
sovd-interfaces = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", rev = "80057cba45842e1298eec8794de28dc228e544b7" }

# Regular crates.io dependencies
async-trait = "0.1"
chrono = "0.4"
clap = "4.5"
cxx = "1.0"
futures = "0.3"
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.43.0", default-features = false }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", default-features = false }
tracing-dlt = { git = "https://github.com/eclipse-opensovd/dlt-tracing-lib.git", version = "0.1.0" }
hex = "0.4"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
toml = "0.8"
rand = "0.9.2"
reqwest = "0.12.24"
thiserror = "2.0.17"
urlencoding = "2.1.3"

# web dependencies
aide = "0.16.0-alpha.1"
axum = { version = "0.8", default-features = false }
axum-extra = "0.12.2"
http = "1.3.1"
schemars = "1.1.0"

[workspace.lints.clippy]
# enable pedantic
pedantic = { level = "warn", priority = -1 }
## exclude some too pedantic lints for now
similar_names = "allow"

# additional lints
clone_on_ref_ptr = "warn"

[profile.release.package."*"]
opt-level = 3

[profile.release-with-debug]
inherits = "release"
debug = true

[patch.crates-io]
# Necessary because upstream is still using an older version of serde_qs (0.14 instead of 1.0.0-rc.3)
aide = { git = "https://github.com/alexmohr/aide.git", rev = "56355cb" }
doip-codec = { git = "https://github.com/theswiftfox/doip-codec.git", rev = "0dba319" }
doip-definitions = { git = "https://github.com/theswiftfox/doip-definitions.git", rev = "bdeab8c" }
flatbuffers = { git = "https://github.com/alexmohr/flatbuffers.git", rev = "0ba3307d" }
